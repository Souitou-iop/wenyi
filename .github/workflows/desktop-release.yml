name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0 or v0.1)'
        required: false
        default: '0.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon (ARM64)
            runner: macos-14
            target: aarch64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust target
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: desktop
        run: |
          pnpm install

      - name: Build Tauri Desktop Bundle
        shell: bash
        run: |
          npx @tauri-apps/cli build --target ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wenyi-desktop-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundles

      - name: List Release Bundles
        run: |
          find release-bundles/ -type f

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${TAG_NAME}"
          fi
          
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Wenyi Desktop $TAG" --notes "Wenyi AI Book Translation unified cross-platform desktop client (Rust-Tauri v2)."
          
          find release-bundles -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.zip" \) -exec gh release upload "$TAG" {} --clobber +
