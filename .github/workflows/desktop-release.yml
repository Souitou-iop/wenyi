name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0 or v0.1)'
        required: false
        default: '0.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon (ARM64)
            runner: macos-14
            target: aarch64-apple-darwin
            os: macos
            arch_suffix: arm64
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch_suffix: x64
          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            os: windows
            arch_suffix: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust target
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: desktop
        run: |
          pnpm install

      - name: 1. Build Slim Desktop Bundle (No Embedded Python)
        shell: bash
        run: |
          mkdir -p dist/binaries dist/packages
          rm -rf dist/binaries/*
          npx @tauri-apps/cli build --target ${{ matrix.target }}
          if [ "${{ matrix.os }}" = "macos" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/packages/Wenyi_0.1.0_${{ matrix.arch_suffix }}-slim.dmg
          else
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/packages/Wenyi_0.1.0_${{ matrix.arch_suffix }}-slim-setup.exe
          fi

      - name: 2. Build Standalone Python Worker (PyInstaller)
        shell: bash
        run: |
          python -m pip install . pyinstaller
          python -m PyInstaller --name wenyi-worker --onefile --clean --noconfirm \
            --paths . --collect-all trans_novel --collect-all ebooklib --collect-all bs4 --collect-all lxml \
            --collect-all openai --collect-all pydantic --collect-all yaml \
            --copy-metadata trans-novel \
            --distpath dist/binaries script/worker_entry.py

      - name: 3. Build Full Desktop Bundle (With Embedded Python Worker)
        shell: bash
        run: |
          npx @tauri-apps/cli build --target ${{ matrix.target }}
          if [ "${{ matrix.os }}" = "macos" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/packages/Wenyi_0.1.0_${{ matrix.arch_suffix }}-full.dmg
          else
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/packages/Wenyi_0.1.0_${{ matrix.arch_suffix }}-full-setup.exe
          fi

      - name: Upload Packaged Installers
        uses: actions/upload-artifact@v4
        with:
          name: wenyi-desktop-packages-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: warn

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundles

      - name: List Release Bundles
        run: |
          find release-bundles/ -type f

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${TAG_NAME}"
          fi
          
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Wenyi Desktop $TAG" --notes "Wenyi AI Book Translation unified cross-platform desktop client (Rust-Tauri v2). Includes Slim (BYOP) and Full (Embedded Python) editions."
          
          find release-bundles -type f \( -name "*.dmg" -o -name "*.exe" \) -exec gh release upload "$TAG" {} --clobber +
